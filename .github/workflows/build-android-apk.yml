name: Build GrooveR Android Release APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure preinstalled Android SDK
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_PATH/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Typecheck and build web bundle
        run: |
          npm run lint
          npm run build

      - name: Initialize Capacitor Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          node -e '
            const fs = require("fs");
            const file = "android/build.gradle";
            let text = fs.readFileSync(file, "utf8");
            text = text.replace(/mavenCentral\(\)/g, "maven { url \"https://maven-central.storage-download.googleapis.com/maven2/\" }\n        mavenCentral()");
            fs.writeFileSync(file, text);
          '

      - name: Configure Android icon, dark theme, and status bar clearance
        run: |
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$dir"
            cp public/pwa-512x512.png "$dir/ic_launcher.png"
            cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
            cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
          done

          node -e '
            const fs = require("fs");
            const path = require("path");

            const stylesXml = `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#090A0D</item>
                  <item name="colorPrimaryDark">#090A0D</item>
                  <item name="colorAccent">#2E8BFF</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#090A0D</item>
                  <item name="android:statusBarColor">#090A0D</item>
                  <item name="android:navigationBarColor">#0D0F14</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
                  <item name="android:statusBarColor">#090A0D</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          `.replace(/^          /gm, "");

            const stylesV35Xml = `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#090A0D</item>
                  <item name="android:statusBarColor">#090A0D</item>
                  <item name="android:navigationBarColor">#0D0F14</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
              </style>
          </resources>
          `.replace(/^          /gm, "");

            fs.writeFileSync("android/app/src/main/res/values/styles.xml", stylesXml);
            fs.mkdirSync("android/app/src/main/res/values-v35", { recursive: true });
            fs.writeFileSync("android/app/src/main/res/values-v35/styles.xml", stylesV35Xml);
          '

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            PKG_DIR=$(dirname "$MAIN_ACT")
            PKG_LINE=$(grep "^package " "$MAIN_ACT")

            node -e '
              const fs = require("fs");
              const manifestPath = "android/app/src/main/AndroidManifest.xml";
              let xml = fs.readFileSync(manifestPath, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
                "<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />",
                "<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />",
                "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
              ];
              for (const p of perms) {
                if (!xml.includes(p)) {
                  xml = xml.replace("</manifest>", "    " + p + "\n</manifest>");
                }
              }
              const svc = "<service android:name=\".MediaPlaybackService\" android:exported=\"false\" android:foregroundServiceType=\"mediaPlayback\" />";
              if (!xml.includes("MediaPlaybackService")) {
                xml = xml.replace("</application>", "        " + svc + "\n    </application>");
              }
              fs.writeFileSync(manifestPath, xml);
            '

            node -e '
              const fs = require("fs");
              const path = require("path");
              const pkgDir = process.argv[1];
              const pkg = process.argv[2];

              const serviceJava = [
                pkg,
                "",
                "import android.app.Notification;",
                "import android.app.NotificationChannel;",
                "import android.app.NotificationManager;",
                "import android.app.PendingIntent;",
                "import android.app.Service;",
                "import android.content.Intent;",
                "import android.content.pm.ServiceInfo;",
                "import android.graphics.Bitmap;",
                "import android.graphics.BitmapFactory;",
                "import android.graphics.drawable.Icon;",
                "import android.media.MediaMetadata;",
                "import android.media.session.MediaSession;",
                "import android.media.session.PlaybackState;",
                "import android.os.Build;",
                "import android.os.IBinder;",
                "import android.util.Base64;",
                "import com.getcapacitor.Bridge;",
                "import java.lang.ref.WeakReference;",
                "",
                "public class MediaPlaybackService extends Service {",
                "    public static final String CHANNEL_ID = \"groover_playback\";",
                "    public static final int NOTIFICATION_ID = 1001;",
                "    public static final String ACTION_UPDATE = \"com.groover.music.UPDATE\";",
                "    public static final String ACTION_PREV = \"com.groover.music.PREV\";",
                "    public static final String ACTION_TOGGLE = \"com.groover.music.TOGGLE\";",
                "    public static final String ACTION_NEXT = \"com.groover.music.NEXT\";",
                "",
                "    public static WeakReference<Bridge> bridgeRef = new WeakReference<>(null);",
                "    public static volatile String pendingArtworkDataUrl = \"\";",
                "    private MediaSession mediaSession;",
                "    private String currentTitle = \"GrooveR\";",
                "    private String currentArtist = \"Offline Library\";",
                "    private String currentAlbum = \"\";",
                "    private String lastArtworkDataUrl = \"\";",
                "    private Bitmap currentArtwork = null;",
                "    private boolean currentPlaying = false;",
                "    private long currentDurationMs = 0;",
                "    private long currentPositionMs = 0;",
                "",
                "    @Override",
                "    public void onCreate() {",
                "        super.onCreate();",
                "        createChannel();",
                "        mediaSession = new MediaSession(this, \"GrooveRSession\");",
                "        mediaSession.setCallback(new MediaSession.Callback() {",
                "            @Override public void onPlay() { dispatchAction(\"play\", -1); }",
                "            @Override public void onPause() { dispatchAction(\"pause\", -1); }",
                "            @Override public void onSkipToNext() { dispatchAction(\"next\", -1); }",
                "            @Override public void onSkipToPrevious() { dispatchAction(\"prev\", -1); }",
                "            @Override public void onSeekTo(long pos) { dispatchAction(\"seek\", pos); }",
                "        });",
                "        mediaSession.setActive(true);",
                "    }",
                "",
                "    private void dispatchAction(String action, long positionMs) {",
                "        Bridge bridge = bridgeRef.get();",
                "        if (bridge == null || bridge.getActivity() == null) return;",
                "        String payload = positionMs >= 0",
                "            ? \"{\\\"action\\\":\\\"\" + action + \"\\\",\\\"positionMs\\\":\" + positionMs + \"}\"",
                "            : \"{\\\"action\\\":\\\"\" + action + \"\\\"}\";",
                "        bridge.getActivity().runOnUiThread(() -> bridge.triggerWindowJSEvent(\"grooverMediaAction\", payload));",
                "    }",
                "",
                "    @Override",
                "    public int onStartCommand(Intent intent, int flags, int startId) {",
                "        if (intent != null && intent.getAction() != null) {",
                "            String act = intent.getAction();",
                "            if (ACTION_PREV.equals(act)) { dispatchAction(\"prev\", -1); return START_STICKY; }",
                "            if (ACTION_TOGGLE.equals(act)) { dispatchAction(\"toggle\", -1); return START_STICKY; }",
                "            if (ACTION_NEXT.equals(act)) { dispatchAction(\"next\", -1); return START_STICKY; }",
                "            if (ACTION_UPDATE.equals(act)) {",
                "                currentTitle = intent.getStringExtra(\"title\") != null ? intent.getStringExtra(\"title\") : \"GrooveR\";",
                "                currentArtist = intent.getStringExtra(\"artist\") != null ? intent.getStringExtra(\"artist\") : \"\";",
                "                currentAlbum = intent.getStringExtra(\"album\") != null ? intent.getStringExtra(\"album\") : \"\";",
                "                currentPlaying = intent.getBooleanExtra(\"isPlaying\", false);",
                "                currentDurationMs = intent.getLongExtra(\"durationMs\", 0);",
                "                currentPositionMs = intent.getLongExtra(\"positionMs\", 0);",
                "                String art = pendingArtworkDataUrl != null ? pendingArtworkDataUrl : \"\";",
                "                if (!art.equals(lastArtworkDataUrl)) {",
                "                    lastArtworkDataUrl = art;",
                "                    currentArtwork = decodeArtwork(art);",
                "                }",
                "                updateMediaSessionAndNotification();",
                "            }",
                "        }",
                "        return START_STICKY;",
                "    }",
                "",
                "    private Bitmap decodeArtwork(String dataUrl) {",
                "        if (dataUrl == null || !dataUrl.startsWith(\"data:image\")) return null;",
                "        try {",
                "            int comma = dataUrl.indexOf(\",\");",
                "            if (comma < 0) return null;",
                "            byte[] decoded = Base64.decode(dataUrl.substring(comma + 1), Base64.DEFAULT);",
                "            return BitmapFactory.decodeByteArray(decoded, 0, decoded.length);",
                "        } catch (Throwable t) {",
                "            return null;",
                "        }",
                "    }",
                "",
                "    private void updateMediaSessionAndNotification() {",
                "        if (mediaSession == null) return;",
                "        MediaMetadata.Builder meta = new MediaMetadata.Builder()",
                "            .putString(MediaMetadata.METADATA_KEY_TITLE, currentTitle)",
                "            .putString(MediaMetadata.METADATA_KEY_ARTIST, currentArtist)",
                "            .putString(MediaMetadata.METADATA_KEY_ALBUM, currentAlbum)",
                "            .putLong(MediaMetadata.METADATA_KEY_DURATION, currentDurationMs);",
                "        if (currentArtwork != null) {",
                "            meta.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, currentArtwork);",
                "        }",
                "        mediaSession.setMetadata(meta.build());",
                "",
                "        int state = currentPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;",
                "        long actions = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO;",
                "        mediaSession.setPlaybackState(new PlaybackState.Builder()",
                "            .setActions(actions)",
                "            .setState(state, currentPositionMs, currentPlaying ? 1.0f : 0f)",
                "            .build());",
                "",
                "        Intent launchIntent = getPackageManager().getLaunchIntentForPackage(getPackageName());",
                "        int piFlags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;",
                "        PendingIntent contentIntent = launchIntent != null ? PendingIntent.getActivity(this, 0, launchIntent, piFlags) : null;",
                "",
                "        PendingIntent prevPi = PendingIntent.getService(this, 1, new Intent(this, MediaPlaybackService.class).setAction(ACTION_PREV), piFlags);",
                "        PendingIntent togglePi = PendingIntent.getService(this, 2, new Intent(this, MediaPlaybackService.class).setAction(ACTION_TOGGLE), piFlags);",
                "        PendingIntent nextPi = PendingIntent.getService(this, 3, new Intent(this, MediaPlaybackService.class).setAction(ACTION_NEXT), piFlags);",
                "",
                "        Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O",
                "            ? new Notification.Builder(this, CHANNEL_ID)",
                "            : new Notification.Builder(this);",
                "        nb.setSmallIcon(android.R.drawable.ic_media_play)",
                "            .setContentTitle(currentTitle)",
                "            .setContentText(currentArtist)",
                "            .setSubText(currentAlbum)",
                "            .setVisibility(Notification.VISIBILITY_PUBLIC)",
                "            .setOnlyAlertOnce(true)",
                "            .setOngoing(currentPlaying)",
                "            .addAction(new Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_previous), \"Previous\", prevPi).build())",
                "            .addAction(new Notification.Action.Builder(Icon.createWithResource(this, currentPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play), currentPlaying ? \"Pause\" : \"Play\", togglePi).build())",
                "            .addAction(new Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_media_next), \"Next\", nextPi).build())",
                "            .setStyle(new Notification.MediaStyle().setMediaSession(mediaSession.getSessionToken()).setShowActionsInCompactView(0, 1, 2));",
                "        if (contentIntent != null) nb.setContentIntent(contentIntent);",
                "        if (currentArtwork != null) nb.setLargeIcon(currentArtwork);",
                "",
                "        try {",
                "            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {",
                "                startForeground(NOTIFICATION_ID, nb.build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);",
                "            } else {",
                "                startForeground(NOTIFICATION_ID, nb.build());",
                "            }",
                "        } catch (Throwable ignored) {",
                "        }",
                "    }",
                "",
                "    private void createChannel() {",
                "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
                "            NotificationChannel ch = new NotificationChannel(CHANNEL_ID, \"Media Playback\", NotificationManager.IMPORTANCE_LOW);",
                "            ch.setShowBadge(false);",
                "            ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);",
                "            NotificationManager nm = getSystemService(NotificationManager.class);",
                "            if (nm != null) nm.createNotificationChannel(ch);",
                "        }",
                "    }",
                "",
                "    @Override",
                "    public void onTaskRemoved(Intent rootIntent) {",
                "        if (!currentPlaying) {",
                "            stopSelf();",
                "        }",
                "        super.onTaskRemoved(rootIntent);",
                "    }",
                "",
                "    @Override",
                "    public void onDestroy() {",
                "        if (mediaSession != null) {",
                "            mediaSession.setActive(false);",
                "            mediaSession.release();",
                "        }",
                "        super.onDestroy();",
                "    }",
                "",
                "    @Override",
                "    public IBinder onBind(Intent intent) { return null; }",
                "}",
                ""
              ].join("\n");

              const pluginJava = [
                pkg,
                "",
                "import android.content.Context;",
                "import android.content.Intent;",
                "import android.os.Build;",
                "import com.getcapacitor.Plugin;",
                "import com.getcapacitor.PluginCall;",
                "import com.getcapacitor.PluginMethod;",
                "import com.getcapacitor.annotation.CapacitorPlugin;",
                "import java.lang.ref.WeakReference;",
                "",
                "@CapacitorPlugin(name = \"LockscreenMedia\")",
                "public class LockscreenMediaPlugin extends Plugin {",
                "    @PluginMethod",
                "    public void updateSession(PluginCall call) {",
                "        MediaPlaybackService.bridgeRef = new WeakReference<>(getBridge());",
                "        MediaPlaybackService.pendingArtworkDataUrl = call.getString(\"artwork\", \"\");",
                "        Context ctx = getContext();",
                "        Intent intent = new Intent(ctx, MediaPlaybackService.class);",
                "        intent.setAction(MediaPlaybackService.ACTION_UPDATE);",
                "        intent.putExtra(\"title\", call.getString(\"title\", \"GrooveR\"));",
                "        intent.putExtra(\"artist\", call.getString(\"artist\", \"\"));",
                "        intent.putExtra(\"album\", call.getString(\"album\", \"\"));",
                "        boolean playing = Boolean.TRUE.equals(call.getBoolean(\"isPlaying\", false));",
                "        intent.putExtra(\"isPlaying\", playing);",
                "        intent.putExtra(\"durationMs\", call.getLong(\"durationMs\", 0L));",
                "        intent.putExtra(\"positionMs\", call.getLong(\"positionMs\", 0L));",
                "        try {",
                "            if (playing && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
                "                ctx.startForegroundService(intent);",
                "            } else {",
                "                ctx.startService(intent);",
                "            }",
                "        } catch (Throwable ignored) {",
                "        }",
                "        call.resolve();",
                "    }",
                "",
                "    @PluginMethod",
                "    public void clearSession(PluginCall call) {",
                "        try {",
                "            getContext().stopService(new Intent(getContext(), MediaPlaybackService.class));",
                "        } catch (Throwable ignored) {",
                "        }",
                "        call.resolve();",
                "    }",
                "}",
                ""
              ].join("\n");

              const mainActivityJava = [
                pkg,
                "",
                "import android.Manifest;",
                "import android.content.pm.PackageManager;",
                "import android.graphics.Color;",
                "import android.os.Build;",
                "import android.os.Bundle;",
                "import android.view.Window;",
                "import androidx.core.view.WindowCompat;",
                "import androidx.core.view.WindowInsetsControllerCompat;",
                "import com.getcapacitor.BridgeActivity;",
                "",
                "public class MainActivity extends BridgeActivity {",
                "    @Override",
                "    protected void onCreate(Bundle savedInstanceState) {",
                "        registerPlugin(LockscreenMediaPlugin.class);",
                "        super.onCreate(savedInstanceState);",
                "        Window window = getWindow();",
                "        WindowCompat.setDecorFitsSystemWindows(window, true);",
                "        window.setStatusBarColor(Color.parseColor(\"#090A0D\"));",
                "        window.setNavigationBarColor(Color.parseColor(\"#0D0F14\"));",
                "        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, window.getDecorView());",
                "        if (controller != null) {",
                "            controller.setAppearanceLightStatusBars(false);",
                "            controller.setAppearanceLightNavigationBars(false);",
                "        }",
                "        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {",
                "            requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);",
                "        }",
                "    }",
                "}",
                ""
              ].join("\n");

              fs.writeFileSync(path.join(pkgDir, "MediaPlaybackService.java"), serviceJava);
              fs.writeFileSync(path.join(pkgDir, "LockscreenMediaPlugin.java"), pluginJava);
              fs.writeFileSync(path.join(pkgDir, "MainActivity.java"), mainActivityJava);
            ' "$PKG_DIR" "$PKG_LINE"
          fi

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon --refresh-dependencies

      - name: Align and sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found!"
            exit 1
          fi

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" GrooveR-aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
            KEYSTORE_PATH="release.jks"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set. Generating an ephemeral release keystore so the APK can still be installed on your OnePlus 15R."
            keytool -genkeypair -v \
              -keystore ephemeral-release.jks \
              -alias groover \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass groover123 \
              -keypass groover123 \
              -dname "CN=GrooveR, OU=Mobile, O=GrooveR, L=Unknown, S=Unknown, C=US"
            KEYSTORE_PATH="ephemeral-release.jks"
            KS_PASS="groover123"
            KEY_ALIAS="groover"
            KEY_PASS="groover123"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out GrooveR-release.apk \
            GrooveR-aligned.apk

          "$APKSIGNER" verify GrooveR-release.apk
          rm -f release.jks ephemeral-release.jks GrooveR-aligned.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrooveR-release-apk
          path: GrooveR-release.apk
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GrooveR-release.apk
